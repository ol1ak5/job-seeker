[project]
name = "job-seeker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "supabase>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobseeker = "src.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.sources", "src.prompts"]
