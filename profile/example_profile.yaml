# Example profile - copy this to profile/master_profile.yaml and edit it.
#
# Everything here is fictional. The file is the single source of truth for CV
# generation: the sections below are rendered, in order, into the CV. Markdown
# inside the strings (bold, italics) is preserved, so format text here exactly
# as it should appear in the finished CV.
#
# Section types:
#   entries    - jobs, projects: heading / subheading / dates / bullets / subitems
#   categories - skills: label + values
#   inline     - one line joined by dots, e.g. spoken languages
#   list       - certifications, education: text + optional dates
#   text       - free paragraphs, e.g. a summary
#
# Per-track control:
#   tracks: [energy]        on a section, item or bullet -> shown only on that track
#   variants: {energy: ..., ai: ...}   -> different wording per track
#   variants: {ai: ""}      -> omitted on that track
#   default: ...            -> used by every track without its own variant
#   {metric} inside a text  -> replaced by the item's `metric` value

